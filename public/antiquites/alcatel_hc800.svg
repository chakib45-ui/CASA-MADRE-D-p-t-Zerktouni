          <circle cx="85" cy="220" r="12" fill="#78716c"/><circle cx="125" cy="220" r="12" fill="#78716c"/><circle cx="165" cy="220" r="12" fill="#78716c"/><circle cx="85" cy="262" r="12" fill="#78716c"/><circle cx="125" cy="262" r="12" fill="#78716c"/><circle cx="165" cy="262" r="12" fill="#78716c"/><circle cx="85" cy="304" r="12" fill="#78716c"/><circle cx="125" cy="304" r="12" fill="#78716c"/><circle cx="165" cy="304" r="12" fill="#78716c"/><circle cx="85" cy="346" r="12" fill="#78716c"/><circle cx="125" cy="346" r="12" fill="#78716c"/><circle cx="165" cy="346" r="12" fill="#78716c"/>
