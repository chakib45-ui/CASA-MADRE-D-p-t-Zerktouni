<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="metalTable" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3e4345"/>
      <stop offset="50%" stop-color="#2a2e30"/>
      <stop offset="100%" stop-color="#1d2022"/>
    </linearGradient>
    <radialGradient id="vinylGrooves" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a2c"/>
      <stop offset="25%" stop-color="#151517"/>
      <stop offset="45%" stop-color="#222225"/>
      <stop offset="70%" stop-color="#141416"/>
      <stop offset="90%" stop-color="#202022"/>
      <stop offset="100%" stop-color="#101011"/>
    </radialGradient>
    <linearGradient id="vinylShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- Background surface -->
  <rect width="800" height="600" fill="url(#metalTable)" />

  <!-- Background Vintage LP Sleeve -->
  <g transform="translate(180, 70)">
    <rect x="0" y="0" width="440" height="440" rx="4" fill="#2d2822" stroke="#5a5247" stroke-width="2"/>
    <!-- Sleeve art tones -->
    <rect x="15" y="15" width="410" height="410" rx="2" fill="#1e1a17"/>
    <!-- Sleeve photo mock -->
    <rect x="25" y="60" width="220" height="340" fill="#3a3229" opacity="0.6"/>
    <!-- Sleeve golden gothic text -->
    <text x="310" y="70" fill="#e5b869" font-family="'Cinzel', Georgia, serif" font-size="22" font-weight="bold" letter-spacing="2">DEMIS ROUSSOS</text>
    <text x="310" y="100" fill="#c49a45" font-family="serif" font-style="italic" font-size="16">Forever and Ever</text>
    <rect x="360" y="30" width="55" height="20" rx="3" fill="#ffd54f" opacity="0.85"/>
    <text x="387" y="44" fill="#000" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">700 036</text>
    <text x="30" y="415" fill="#a09080" font-family="sans-serif" font-size="10">Distribution France Discodis • Delphine</text>
  </g>

  <!-- 33 RPM Vinyl Record on Top -->
  <g transform="translate(400, 310)">
    <!-- Shadow -->
    <circle cx="5" cy="8" r="230" fill="#000000" opacity="0.55" filter="blur(8px)"/>

    <!-- Vinyl Disc Outer -->
    <circle cx="0" cy="0" r="230" fill="url(#vinylGrooves)" stroke="#3a3a3d" stroke-width="2"/>
    
    <!-- Concentric Grooves -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="#252528" stroke-width="1.5" opacity="0.7"/>
    <circle cx="0" cy="0" r="205" fill="none" stroke="#2c2c30" stroke-width="1" opacity="0.8"/>
    <circle cx="0" cy="0" r="190" fill="none" stroke="#1f1f22" stroke-width="1.5" opacity="0.9"/>
    <circle cx="0" cy="0" r="175" fill="none" stroke="#29292d" stroke-width="1" opacity="0.8"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#212124" stroke-width="1.5" opacity="0.9"/>
    <circle cx="0" cy="0" r="145" fill="none" stroke="#28282b" stroke-width="1" opacity="0.7"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#1c1c1e" stroke-width="1.5" opacity="0.9"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="#262629" stroke-width="1" opacity="0.8"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#1a1a1c" stroke-width="1.5" opacity="0.9"/>

    <!-- Light reflection shine -->
    <circle cx="0" cy="0" r="230" fill="url(#vinylShine)"/>

    <!-- Central Paper Label (Philips Blue/Silver style) -->
    <circle cx="0" cy="0" r="82" fill="#2c363f" stroke="#485968" stroke-width="2"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#6b7c8c" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Philips Label Typography -->
    <!-- Philips Logo box -->
    <rect x="-42" y="-56" width="84" height="24" rx="4" fill="#ffffff" opacity="0.95"/>
    <text x="0" y="-40" fill="#1b2838" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="2">PHILIPS</text>

    <!-- Stereo 33 1/3 Box -->
    <rect x="-48" y="-26" width="96" height="17" rx="2" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
    <text x="0" y="-14" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">STEREO 33⅓</text>

    <!-- Side 2 Box -->
    <rect x="42" y="-15" width="20" height="20" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
    <text x="52" y="-1" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">2</text>

    <!-- Catalog ref -->
    <text x="0" y="8" fill="#d2dbe2" font-family="monospace" font-size="8" text-anchor="middle">6325 021</text>

    <!-- Album & Artist -->
    <text x="0" y="24" fill="#ffffff" font-family="'Cinzel', Georgia, serif" font-size="10" font-weight="bold" text-anchor="middle">"FOREVER AND EVER"</text>
    <text x="0" y="38" fill="#ffca28" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">DEMIS ROUSSOS</text>

    <text x="0" y="52" fill="#bac7d5" font-family="sans-serif" font-size="7" text-anchor="middle">Made in France • BIEM / SACEM</text>

    <!-- Center Spindle Hole -->
    <circle cx="0" cy="0" r="10" fill="#000000" stroke="#8c9ba5" stroke-width="1.5"/>
  </g>
</svg>
